<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>設備保養提醒 · OpenClaw</title>
  <link rel="stylesheet" href="/assets/css/style.css?v=2" />
</head>
<body class="tool-page">
  <div class="app-bg" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <span class="logo-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></span>
        <span class="logo-text">Open<span>Claw</span> 製造</span>
      </a>
      <nav class="header-nav">
        <a href="/" class="nav-link">← 首頁</a>
        <a href="/openclaw/" class="btn btn-primary">AI 控制台</a>
      </nav>
    </div>
  </header>
  <main class="container page-main">
    <div class="page-hero">
      <p class="breadcrumb"><a href="/">首頁</a> / <span>設備保養與校準提醒</span></p>
      <h1 class="page-title">設備保養與校準提醒</h1>
      <p class="page-desc">每行一台設備：設備名,上次日期YYYY-MM-DD,週期(天)。自動計算到期日與工單草案。</p>
    </div>
    <div class="layout-two">
      <div class="panel">
        <h3>設備清單</h3>
        <form id="form">
          <div class="form-group">
            <label>設備資料</label>
            <textarea id="equip" rows="12">CMM-01,2024-11-01,180
CNC-02,2025-03-15,90
空壓機A,2025-01-10,60
量具組-游標卡尺,2025-04-01,365</textarea>
          </div>
          <button type="submit" class="btn">計算到期提醒</button>
        </form>
      </div>
      <div class="panel panel-output">
        <h3>保養／校準提醒</h3>
        <div class="table-wrap" id="tableWrap"></div>
        <pre class="output-box" id="output"></pre>
        <div class="output-actions">
          <button type="button" class="btn btn-secondary" onclick="copyOutput('output')">複製</button>
          <button type="button" class="btn btn-secondary" onclick="downloadOutput('output','maintenance.txt')">下載</button>
        </div>
      </div>
    </div>
  
  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="/">返回首頁</a>
      <span>·</span>
      <a href="/openclaw/">OpenClaw 控制台</a>
    </div>
  </footer>

</main>
  <script src="/assets/js/common.js?v=2"></script>
  <script>
    $("form").onsubmit = (e) => {
      e.preventDefault();
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const rows = parseLines($("equip").value)
        .map((line) => {
          const p = line.split(/[,，\t]/).map((s) => s.trim());
          const name = p[0];
          const last = p[1] ? new Date(p[1]) : null;
          const cycle = parseInt(p[2], 10) || 90;
          if (!name || !last || isNaN(last)) return null;
          const due = new Date(last);
          due.setDate(due.getDate() + cycle);
          const daysLeft = Math.ceil((due - today) / 86400000);
          let status = "正常";
          if (daysLeft < 0) status = "已逾期";
          else if (daysLeft <= 7) status = "即將到期";
          else if (daysLeft <= 30) status = "一個月內";
          return {
            name,
            last: last.toISOString().slice(0, 10),
            cycle,
            due: due.toISOString().slice(0, 10),
            daysLeft,
            status,
          };
        })
        .filter(Boolean)
        .sort((a, b) => a.daysLeft - b.daysLeft);
      $("tableWrap").innerHTML = `<table><thead><tr><th>設備</th><th>上次</th><th>週期</th><th>到期日</th><th>剩餘天</th><th>狀態</th></tr></thead><tbody>${rows
        .map((r) => {
          const color =
            r.status === "已逾期"
              ? "#ef4444"
              : r.status === "即將到期"
                ? "#f59e0b"
                : "#22c55e";
          return `<tr><td>${r.name}</td><td>${r.last}</td><td>${r.cycle}天</td><td>${r.due}</td><td>${r.daysLeft}</td><td style="color:${color}">${r.status}</td></tr>`;
        })
        .join("")}</tbody></table>`;
      showOutput("output", [
        "=== 設備保養／校準提醒 ===",
        `產出：${formatDate()}`,
        "",
        ...rows.map(
          (r) =>
            `[${r.status}] ${r.name} | 上次 ${r.last} | 週期 ${r.cycle}天 | 到期 ${r.due} | 剩 ${r.daysLeft} 天`
        ),
        "",
        "--- 工單草案 ---",
        ...rows
          .filter((r) => r.daysLeft <= 30)
          .map(
            (r) =>
              `WO-MAINT-${r.name.replace(/\W/g, "")}: ${r.name} ${r.status === "已逾期" ? "逾期保養" : "預防保養"}，計畫日 ${r.due}`
          ),
        rows.filter((r) => r.daysLeft <= 30).length ? "" : "（30 天內無到期設備）",
      ].join("\n"));
    };
  </script>
</body>
</html>
