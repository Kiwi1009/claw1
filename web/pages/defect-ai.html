<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>外觀不良初篩 · OpenClaw 製造</title>
  <link rel="stylesheet" href="/assets/css/style.css?v=2" />
</head>
<body class="tool-page">
  <div class="app-bg" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <span class="logo-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></span>
        <span class="logo-text">Open<span>Claw</span> 製造</span>
      </a>
      <nav class="header-nav">
        <a href="/" class="nav-link">← 首頁</a>
        <a href="/openclaw/" class="btn btn-primary">AI 控制台</a>
      </nav>
    </div>
  </header>
  <main class="container page-main">
    <div class="page-hero">
      <p class="breadcrumb"><a href="/">首頁</a> / <span>外觀不良初篩</span></p>
      <h1>外觀不良初篩</h1>
      <p class="page-desc">登錄影像檢驗結果與嚴重度。</p>
    </div>
    <div class="layout-two">
      <div class="panel">
        <h3>輸入</h3>
        <form id="form">
          <div class="form-group"><label>批號／工單</label><input id="lot" /></div>
          <div class="form-group"><label>缺陷類型</label><select id="type"><option>刮傷</option><option>毛邊</option><option>色差</option><option>凹陷</option><option>異物</option></select></div>
          <div class="form-row"><div class="form-group"><label>嚴重度</label><select id="sev"><option>輕微</option><option>中等</option><option>嚴重</option></select></div>
          <div class="form-group"><label>位置說明</label><input id="loc" /></div></div>
          <div class="form-group"><label>備註</label><textarea id="note"></textarea></div>
        
          <button type="submit" class="btn" style="margin-top:0.75rem">產出草案</button>
        </form>
      </div>
      <div class="panel panel-output">
        <h3>輸出草案</h3>
        <pre class="output-box" id="output"><span class="output-placeholder">填寫後按「產出草案」</span></pre>
        <div class="output-actions">
          <button type="button" class="btn btn-secondary" onclick="copyOutput('output')">複製</button>
          <button type="button" class="btn btn-secondary" onclick="downloadOutput('output','defect-ai.txt')">下載</button>
        </div>
      </div>
    </div>
  
  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="/">返回首頁</a>
      <span>·</span>
      <a href="/openclaw/">OpenClaw 控制台</a>
    </div>
  </footer>

</main>
  <script src="/assets/js/common.js?v=2"></script>
  <script>
          $("form").onsubmit=e=>{e.preventDefault();
            showOutput("output",["=== 外觀檢驗紀錄 ===",`批號：${$("lot").value}`,`類型：${$("type").value}`,`嚴重度：${$("sev").value}`,`位置：${$("loc").value}`,`判定：${$("sev").value==="嚴重"?"隔離":"複判"}`,`備註：${$("note").value}`].join("\n"));
          };
        </script>
</body>
</html>
