<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>改善提案 A3 · OpenClaw 製造</title>
  <link rel="stylesheet" href="/assets/css/style.css?v=2" />
</head>
<body class="tool-page">
  <div class="app-bg" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <span class="logo-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></span>
        <span class="logo-text">Open<span>Claw</span> 製造</span>
      </a>
      <nav class="header-nav">
        <a href="/" class="nav-link">← 首頁</a>
        <a href="/openclaw/" class="btn btn-primary">AI 控制台</a>
      </nav>
    </div>
  </header>
  <main class="container page-main">
    <div class="page-hero">
      <p class="breadcrumb"><a href="/">首頁</a> / <span>改善提案\ A3</span></p>
      <h1>改善提案 A3</h1>
      <p class="page-desc">A3 一頁式改善報告架構。</p>
    </div>
    <div class="layout-two">
      <div class="panel">
        <h3>輸入</h3>
        <form id="form">
          <div class="form-group"><label>主題</label><input id="topic" required /></div>
          <div class="form-group"><label>背景／問題</label><textarea id="bg"></textarea></div>
          <div class="form-group"><label>現況</label><textarea id="current"></textarea></div>
          <div class="form-group"><label>目標</label><textarea id="goal"></textarea></div>
          <div class="form-group"><label>對策</label><textarea id="action"></textarea></div>
        
          <button type="submit" class="btn" style="margin-top:0.75rem">產出草案</button>
        </form>
      </div>
      <div class="panel panel-output">
        <h3>輸出草案</h3>
        <pre class="output-box" id="output"><span class="output-placeholder">填寫後按「產出草案」</span></pre>
        <div class="output-actions">
          <button type="button" class="btn btn-secondary" onclick="copyOutput('output')">複製</button>
          <button type="button" class="btn btn-secondary" onclick="downloadOutput('output','kaizen-a3.txt')">下載</button>
        </div>
      </div>
    </div>
  
  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="/">返回首頁</a>
      <span>·</span>
      <a href="/openclaw/">OpenClaw 控制台</a>
    </div>
  </footer>

</main>
  <script src="/assets/js/common.js?v=2"></script>
  <script>
          $("form").onsubmit=e=>{e.preventDefault();
            showOutput("output",["# A3 改善提案",`主題：${$("topic").value}`,`背景：${$("bg").value}`,`現況：${$("current").value}`,`目標：${$("goal").value}`,`對策：${$("action").value}`,`追蹤：待填`].join("\n"));
          };
        </script>
</body>
</html>
