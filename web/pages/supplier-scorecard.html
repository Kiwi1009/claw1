<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>供應商評分卡 · OpenClaw 製造</title>
  <link rel="stylesheet" href="/assets/css/style.css?v=2" />
</head>
<body class="tool-page">
  <div class="app-bg" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <span class="logo-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></span>
        <span class="logo-text">Open<span>Claw</span> 製造</span>
      </a>
      <nav class="header-nav">
        <a href="/" class="nav-link">← 首頁</a>
        <a href="/openclaw/" class="btn btn-primary">AI 控制台</a>
      </nav>
    </div>
  </header>
  <main class="container page-main">
    <div class="page-hero">
      <p class="breadcrumb"><a href="/">首頁</a> / <span>供應商評分卡</span></p>
      <h1>供應商評分卡</h1>
      <p class="page-desc">多供應商交期、品質、價格加權評分。</p>
    </div>
    <div class="layout-two">
      <div class="panel">
        <h3>輸入</h3>
        <form id="form">
          <div class="form-group"><label>供應商資料（每行：名稱,交期分,品質分,價格分,溝通分）</label>
          <textarea id="rows" rows="8">甲公司,85,92,78,80
乙公司,70,88,90,75
丙公司,95,80,65,70</textarea></div>
          <p style="font-size:0.8rem;color:var(--muted)">各項 0–100，加權：交期30% 品質35% 價格25% 溝通10%</p>
        
          <button type="submit" class="btn" style="margin-top:0.75rem">產出草案</button>
        </form>
      </div>
      <div class="panel panel-output">
        <h3>輸出草案</h3>
        <pre class="output-box" id="output"><span class="output-placeholder">填寫後按「產出草案」</span></pre>
        <div class="output-actions">
          <button type="button" class="btn btn-secondary" onclick="copyOutput('output')">複製</button>
          <button type="button" class="btn btn-secondary" onclick="downloadOutput('output','supplier-scorecard.txt')">下載</button>
        </div>
      </div>
    </div>
  
  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="/">返回首頁</a>
      <span>·</span>
      <a href="/openclaw/">OpenClaw 控制台</a>
    </div>
  </footer>

</main>
  <script src="/assets/js/common.js?v=2"></script>
  <script>
          $("form").onsubmit=e=>{e.preventDefault();
            const rows=$("rows").value.split("\n").map(l=>{const p=l.split(/[,，]/);return{name:p[0],d:+p[1],q:+p[2],p:+p[3],c:+p[4]};}).filter(r=>r.name);
            const scored=rows.map(r=>({...r,total:Math.round(r.d*0.3+r.q*0.35+r.p*0.25+r.c*0.1)})).sort((a,b)=>b.total-a.total);
            showOutput("output",["=== 供應商評分 ===",...scored.map((r,i)=>`${i+1}. ${r.name} 綜合${r.total} (交${r.d} 品${r.q} 價${r.p})`)].join("\n"));
          };
        </script>
</body>
</html>
