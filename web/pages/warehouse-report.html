<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>倉儲營運報表 · OpenClaw</title>
  <link rel="stylesheet" href="/assets/css/style.css?v=2" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="tool-page">
  <div class="app-bg" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <span class="logo-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></span>
        <span class="logo-text">Open<span>Claw</span> 製造</span>
      </a>
      <nav class="header-nav">
        <a href="/" class="nav-link">← 首頁</a>
        <a href="/openclaw/" class="btn btn-primary">AI 控制台</a>
      </nav>
    </div>
  </header>
  <main class="container page-main">
    <div class="page-hero">
      <p class="breadcrumb"><a href="/">首頁</a> / <span>倉儲營運報表</span></p>
      <h1 class="page-title">倉儲營運報表</h1>
      <p class="page-desc">輸入庫存資料（CSV：料號,品名,庫存,安全庫存,單價）或手動貼上，產出 ABC 分類與缺貨警示。</p>
    </div>
    <div class="layout-two">
      <div class="panel">
        <h3>庫存資料</h3>
        <form id="form">
          <div class="form-group">
            <label>貼上 CSV（含標題列可省略）</label>
            <textarea id="csv" rows="12">料號,品名,庫存,安全庫存,單價
P-001,軸承A,120,50,85
P-002,螺栓B,15,30,12
P-003,墊片C,500,100,3
P-004,密封圈D,8,20,45
P-005,襯套E,200,80,22</textarea>
          </div>
          <button type="submit" class="btn">產出報表</button>
        </form>
      </div>
      <div class="panel panel-output">
        <h3>分析結果</h3>
        <div class="chart-wrap"><canvas id="chart"></canvas></div>
        <div class="table-wrap" id="tableWrap"></div>
        <pre class="output-box" id="output" style="max-height:180px"></pre>
        <div class="output-actions">
          <button type="button" class="btn btn-secondary" onclick="copyOutput('output')">複製</button>
        </div>
      </div>
    </div>
  
  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="/">返回首頁</a>
      <span>·</span>
      <a href="/openclaw/">OpenClaw 控制台</a>
    </div>
  </footer>

</main>
  <script src="/assets/js/common.js?v=2"></script>
  <script>
    let chartInst = null;
    function parseCsv(text) {
      const lines = parseLines(text);
      return lines.map((line, i) => {
        const p = line.split(/[,，\t]/).map((s) => s.trim());
        if (i === 0 && (p[0].includes("料") || p[0].toLowerCase().includes("sku"))) return null;
        return {
          sku: p[0],
          name: p[1] || "",
          stock: parseFloat(p[2]) || 0,
          safety: parseFloat(p[3]) || 0,
          price: parseFloat(p[4]) || 0,
        };
      }).filter(Boolean);
    }
    $("form").onsubmit = (e) => {
      e.preventDefault();
      const items = parseCsv($("csv").value);
      if (!items.length) {
        alert("無有效資料");
        return;
      }
      items.forEach((it) => {
        it.value = it.stock * it.price;
        it.shortage = it.stock < it.safety;
      });
      const totalVal = items.reduce((s, it) => s + it.value, 0);
      items.sort((a, b) => b.value - a.value);
      let cum = 0;
      items.forEach((it) => {
        cum += it.value;
        const pct = totalVal ? (cum / totalVal) * 100 : 0;
        it.abc = pct <= 80 ? "A" : pct <= 95 ? "B" : "C";
      });
      const shortages = items.filter((it) => it.shortage);
      $("tableWrap").innerHTML = `<table><thead><tr><th>料號</th><th>庫存</th><th>安全</th><th>ABC</th><th>狀態</th></tr></thead><tbody>${items
        .map(
          (it) =>
            `<tr><td>${it.sku}</td><td>${it.stock}</td><td>${it.safety}</td><td>${it.abc}</td><td>${it.shortage ? '<span style="color:#ef4444">缺貨風險</span>' : "OK"}</td></tr>`
        )
        .join("")}</tbody></table>`;
      if (chartInst) chartInst.destroy();
      chartInst = new Chart($("chart"), {
        type: "bar",
        data: {
          labels: items.map((it) => it.sku),
          datasets: [
            { label: "庫存", data: items.map((it) => it.stock), backgroundColor: "#3b82f6aa" },
            { label: "安全庫存", data: items.map((it) => it.safety), backgroundColor: "#f59e0baa" },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: "#64748b" } } },
          scales: {
            x: { ticks: { color: "#64748b" }, grid: { color: "#e2e8f0" } },
            y: { ticks: { color: "#64748b" }, grid: { color: "#e2e8f0" } },
          },
        },
      });
      showOutput("output", [
        "=== 倉儲週報摘要 ===",
        `時間：${formatDate()}`,
        `SKU 數：${items.length}`,
        `庫存總金額（估算）：${totalVal.toFixed(0)}`,
        `缺貨風險品項：${shortages.length}`,
        shortages.length
          ? "缺貨清單：" + shortages.map((it) => it.sku).join(", ")
          : "目前無低於安全庫存品項",
        "",
        "ABC：A=累計80%價值 B=80-95% C=其餘",
      ].join("\n"));
    };
  </script>
</body>
</html>
