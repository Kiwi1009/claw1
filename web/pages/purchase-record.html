<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>採購紀錄登錄 · OpenClaw</title>
  <link rel="stylesheet" href="/assets/css/style.css?v=2" />
</head>
<body class="tool-page">
  <div class="app-bg" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <span class="logo-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></span>
        <span class="logo-text">Open<span>Claw</span> 製造</span>
      </a>
      <nav class="header-nav">
        <a href="/" class="nav-link">← 首頁</a>
        <a href="/openclaw/" class="btn btn-primary">AI 控制台</a>
      </nav>
    </div>
  </header>
  <main class="container page-main">
    <div class="page-hero">
      <p class="breadcrumb"><a href="/">首頁</a> / <span>採購紀錄登錄</span></p>
      <h1 class="page-title">採購紀錄登錄</h1>
      <p class="page-desc">結構化記錄供應商、料號、數量、單價與交期，方便追蹤與對帳。</p>
    </div>
    <div class="layout-two">
      <div class="panel">
        <h3>採購資料</h3>
        <form id="form">
          <div class="form-group">
            <label>採購單號（可自動產生）</label>
            <input type="text" id="poNo" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>供應商</label>
              <input type="text" id="vendor" required />
            </div>
            <div class="form-group">
              <label>採購日期</label>
              <input type="date" id="poDate" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>料號</label>
              <input type="text" id="partNo" required />
            </div>
            <div class="form-group">
              <label>品名</label>
              <input type="text" id="partName" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>數量</label>
              <input type="number" id="qty" min="1" value="1" />
            </div>
            <div class="form-group">
              <label>單價</label>
              <input type="number" id="price" min="0" step="0.01" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>幣別</label>
              <select id="currency"><option>TWD</option><option>USD</option><option>CNY</option></select>
            </div>
            <div class="form-group">
              <label>預計交期</label>
              <input type="date" id="dueDate" />
            </div>
          </div>
          <div class="form-group">
            <label>備註</label>
            <textarea id="note"></textarea>
          </div>
          <button type="submit" class="btn">產出採購紀錄</button>
        </form>
      </div>
      <div class="panel panel-output">
        <h3>採購紀錄草案</h3>
        <pre class="output-box" id="output"></pre>
        <div class="output-actions">
          <button type="button" class="btn btn-secondary" onclick="copyOutput('output')">複製</button>
          <button type="button" class="btn btn-secondary" onclick="downloadOutput('output','purchase-record.txt')">下載</button>
        </div>
      </div>
    </div>
  
  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="/">返回首頁</a>
      <span>·</span>
      <a href="/openclaw/">OpenClaw 控制台</a>
    </div>
  </footer>

</main>
  <script src="/assets/js/common.js?v=2"></script>
  <script>
    const today = new Date().toISOString().slice(0, 10);
    $("poDate").value = today;
    const d = new Date();
    $("poNo").value = `PO-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${String(Math.floor(Math.random()*900)+100)}`;
    $("form").onsubmit = (e) => {
      e.preventDefault();
      const qty = +$("qty").value || 0;
      const price = +$("price").value || 0;
      const total = (qty * price).toFixed(2);
      showOutput("output", [
        "=== 採購紀錄 ===",
        `單號：${$("poNo").value}`,
        `日期：${$("poDate").value}`,
        `供應商：${$("vendor").value}`,
        `料號：${$("partNo").value}`,
        `品名：${$("partName").value || "—"}`,
        `數量：${qty}`,
        `單價：${$("currency").value} ${price}`,
        `金額：${$("currency").value} ${total}`,
        `交期：${$("dueDate").value || "待確認"}`,
        `備註：${$("note").value || "—"}`,
        "---",
        "狀態：草案 · 待採購主管核准",
      ].join("\n"));
    };
  </script>
</body>
</html>
