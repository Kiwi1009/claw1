<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>專業報價單 · OpenClaw 製造</title>
  <link rel="stylesheet" href="/assets/css/style.css?v=2" />
</head>
<body class="tool-page">
  <div class="app-bg" aria-hidden="true"></div>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <span class="logo-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg></span>
        <span class="logo-text">Open<span>Claw</span> 製造</span>
      </a>
      <nav class="header-nav">
        <a href="/" class="nav-link">← 首頁</a>
        <a href="/openclaw/" class="btn btn-primary">AI 控制台</a>
      </nav>
    </div>
  </header>
  <main class="container page-main">
    <div class="page-hero">
      <p class="breadcrumb"><a href="/">首頁</a> / <span>專業報價單</span></p>
      <h1>專業報價單</h1>
      <p class="page-desc">產出含單號、客戶、品項與貿易條款的報價草案。</p>
    </div>
    <div class="layout-two">
      <div class="panel">
        <h3>輸入</h3>
        <form id="form">
          <div class="form-row"><div class="form-group"><label>報價單號</label><input id="qtNo" /></div>
          <div class="form-group"><label>客戶公司</label><input id="customer" required /></div></div>
          <div class="form-group"><label>品項（每行：品名,數量,單價）</label><textarea id="lines" rows="6">軸承A,100,85
螺栓B,500,12</textarea></div>
          <div class="form-row"><div class="form-group"><label>幣別</label><select id="cur"><option>TWD</option><option>USD</option></select></div>
          <div class="form-group"><label>交期</label><input id="lead" placeholder="30 天" /></div></div>
          <div class="form-group"><label>Incoterms</label><input id="inco" value="FOB" /></div>
        
          <button type="submit" class="btn" style="margin-top:0.75rem">產出草案</button>
        </form>
      </div>
      <div class="panel panel-output">
        <h3>輸出草案</h3>
        <pre class="output-box" id="output"><span class="output-placeholder">填寫後按「產出草案」</span></pre>
        <div class="output-actions">
          <button type="button" class="btn btn-secondary" onclick="copyOutput('output')">複製</button>
          <button type="button" class="btn btn-secondary" onclick="downloadOutput('output','quotation.txt')">下載</button>
        </div>
      </div>
    </div>
  
  <footer class="site-footer">
    <div class="container footer-inner">
      <a href="/">返回首頁</a>
      <span>·</span>
      <a href="/openclaw/">OpenClaw 控制台</a>
    </div>
  </footer>

</main>
  <script src="/assets/js/common.js?v=2"></script>
  <script>
          $("form").onsubmit=e=>{e.preventDefault();
            const lines=$("lines").value.split("\n").filter(Boolean).map(l=>{const p=l.split(/[,，]/);return{品名:p[0],數量:p[1],單價:p[2]};});
            const total=lines.reduce((s,x)=>s+(+x.數量||0)*(+x.單價||0),0);
            showOutput("output",["=== 報價單草案 ===",`單號：${$("qtNo").value||"QT-"+Date.now()}`,`客戶：${$("customer").value}`,`幣別：${$("cur").value}`,`交期：${$("lead").value}`,`條款：${$("inco").value}`,"","品項:",...lines.map((x,i)=>`${i+1}. ${x.品名} x${x.數量} @${x.單價}`),`\n總計：${total.toFixed(2)}`].join("\n"));
          };
        </script>
</body>
</html>
